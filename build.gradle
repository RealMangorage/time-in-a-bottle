plugins {
    // Required for NeoGradle
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.7"
    id 'net.darkhax.curseforgegradle' version '1.1.24'
}

if (!"$changelog".contains("$version")) {
    throw new IllegalStateException("Update the changelog!")
}

println("Version -> $version")
println("Version Type -> $build_type")
println("Changelog:")
println("$changelog")