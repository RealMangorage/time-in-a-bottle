plugins {
    id 'maven-publish'
    id 'multiloader-common-api'
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT'
}

minecraft {
    version(minecraft_version)
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if(aw.exists()){
        accessWideners(aw)
    }
}

repositories {
    mavenLocal()
    maven {
        url = uri("https://maven.terraformersmc.com/")
    }
}

dependencies {
    compileOnly("mezz.jei:jei-$minecraft_version-common-api:$jei_version")
    compileOnly "dev.emi:emi-xplat-mojmap:$emi_version+$minecraft_version:api"

    compileOnly group:'org.spongepowered', name:'mixin', version:'0.8.5'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}


task sourceJar(type: Jar) {
    from sourceSets.main.allSource
}

tasks.getByName("publish").setGroup("modpublishing")

publishing {
    publications {
        mavenJava(MavenPublication) {
            // Use project.tasks.getByName to reference the customJar task
            groupId = 'org.mangorage'
            artifactId = "tiab-common-api"
            version = "$version"
            artifacts {
                artifact jar
                artifact sourcesJar
                artifact javadocJar
            }
        }
    }

    repositories {
        maven {
            url = uri("$buildDir/repo")
        }
        maven {
            url = "https://maven.mangorage.org/"
            credentials {
                username = "mango"
                password = "$MAVEN_PASSWORD"
            }
        }
    }
}